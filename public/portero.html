<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portero</title>
  <link rel="stylesheet" href="app.css" />
  <script src="menu.js"></script>
  <script src="evento.js"></script>
</head>
<body>
  <div class="page">
    <h1 style="margin-bottom:14px">Control de acceso</h1>

    <div class="ticket" style="text-align:center">
      <div id="contadores" class="num" style="font-size:22px">Vendidas: -- · Ingresaron: --</div>
    </div>

    <div class="search-row" style="margin-top:6px">
      <div class="field">
        <label for="cedula">Cédula del comprador</label>
        <input id="cedula" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 1029384756" autofocus />
      </div>
      <button id="buscar-btn" type="button">Consultar</button>
    </div>

    <div id="resultado" style="margin-top:14px"></div>
  </div>

  <script>
    initMenu();
    const TOKEN = localStorage.getItem("token");
    const cedulaInput = document.getElementById("cedula");
    const resultado = document.getElementById("resultado");
    const contadores = document.getElementById("contadores");

    function eventoId() {
      return localStorage.getItem("eventoId");
    }

    function mostrarError(elemento, mensaje) {
      elemento.textContent = mensaje;
      elemento.classList.remove("hidden");
    }

    async function leerError(response) {
      const data = await response.json().catch(() => ({}));
      return typeof data.error === "string" ? data.error : "No se pudo completar la solicitud";
    }

    async function buscar(cedula) {
      const valor = cedula.trim();
      if (!eventoId() || !valor) return;
      resultado.innerHTML = "";
      const r = await fetch(`/api/eventos/${eventoId()}/entradas/${encodeURIComponent(valor)}`, {
        headers: { Authorization: `Bearer ${TOKEN}` },
      });
      if (r.status === 404) {
        resultado.innerHTML = `<div class="status err">No hay una boleta vigente para esa cédula en este evento.</div>`;
        return;
      }
      if (!r.ok) {
        resultado.innerHTML = `<div class="status err"></div>`;
        mostrarError(resultado.firstChild, await leerError(r));
        return;
      }
      const data = await r.json();
      if (data.checkin_en) {
        resultado.innerHTML = `<div class="status warn">${data.nombre} · Ya ingresó a las ${new Date(data.checkin_en).toLocaleTimeString()}</div>`;
      } else {
        resultado.innerHTML = `<div class="status ok" style="margin-bottom:10px">${data.nombre} · $${data.monto_pagado}</div>
          <button id="marcar-btn" type="button">Marcar ingreso</button>`;
        document.getElementById("marcar-btn").addEventListener("click", () => marcarIngreso(valor));
      }
    }

    async function marcarIngreso(cedula) {
      const r = await fetch(`/api/eventos/${eventoId()}/checkin`, {
        method: "POST",
        headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({ cedula }),
      });
      if (!r.ok) {
        resultado.innerHTML = `<div class="status err"></div>`;
        mostrarError(resultado.firstChild, await leerError(r));
        return;
      }
      resultado.innerHTML = `<div class="status ok">Ingreso marcado correctamente.</div>`;
      refrescarContadores();
    }

    document.getElementById("buscar-btn").addEventListener("click", () => buscar(cedulaInput.value));
    cedulaInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") buscar(cedulaInput.value);
    });

    async function refrescarContadores() {
      if (!eventoId()) { contadores.textContent = "Selecciona un evento activo."; return; }
      const r = await fetch(`/api/eventos/${eventoId()}/resumen`, { headers: { Authorization: `Bearer ${TOKEN}` } });
      if (!r.ok) {
        contadores.textContent = await leerError(r);
        return;
      }
      const d = await r.json();
      contadores.textContent = `Vendidas: ${d.vendidas ?? 0} · Ingresaron: ${d.ingresaron ?? 0}`;
    }

    initEventoSelector(() => {
      resultado.innerHTML = "";
      refrescarContadores();
    });

    setInterval(() => { if (!document.hidden) refrescarContadores(); }, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescarContadores(); });
  </script>
</body>
</html>
