<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="page" style="display:flex; align-items:center; min-height:100vh; padding-top:0; padding-bottom:0;">
    <div style="width:100%">
      <div style="text-align:center; margin-bottom:22px;">
        <img src="logo.png" alt="Sangre Nueva" style="max-height:110px; width:auto; margin-bottom:8px;" />
        <p>Ventanilla de acceso</p>
      </div>
      <div class="ticket">
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" placeholder="tucorreo@evento.com" />
        </div>
        <div class="field" style="margin-bottom:0">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
        <div class="stub">
          <button onclick="login()">Entrar</button>
        </div>
      </div>
      <div id="error" class="status err hidden" style="margin-top:10px"></div>
    </div>
  </div>
  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const r = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) {
        document.getElementById("error").textContent = data.error;
        document.getElementById("error").classList.remove("hidden");
        return;
      }
      localStorage.setItem("token", data.token);
      localStorage.setItem("rol", data.rol);
      localStorage.setItem("nombre", data.nombre);
      location.href = data.rol === "vendedor" ? "vendedor.html" : data.rol === "portero" ? "portero.html" : "admin.html";
    }
  </script>
</body>
</html>
