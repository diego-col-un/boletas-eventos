<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div style="padding:16px">
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Contraseña" style="margin-top:8px" />
    <button onclick="login()" style="margin-top:8px">Entrar</button>
    <div id="error" class="err card" style="display:none; margin-top:8px"></div>
  </div>
  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const r = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) {
        document.getElementById("error").textContent = data.error;
        document.getElementById("error").style.display = "block";
        return;
      }
      localStorage.setItem("token", data.token);
      // De momento pide el id del evento activo manualmente; en el paso 14 se automatiza
      const eventoId = prompt("ID del evento activo:");
      localStorage.setItem("eventoId", eventoId);
      location.href = data.rol === "vendedor" ? "vendedor.html" : data.rol === "portero" ? "portero.html" : "admin.html";
    }
  </script>
</body>
</html>
