<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin</title>
  <link rel="stylesheet" href="app.css" />
  <script src="menu.js"></script>
  <style>
    .estado-btn { margin: 3px 6px 0 0; padding: 8px 12px; font-size: 13px; }
    .estado-btn.activo-actual { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
  <!-- Vista: lista de eventos -->
  <div id="vistaLista" class="page">
    <div class="field">
      <input id="buscar-evento" placeholder="Buscar evento por nombre…" />
    </div>
    <div id="listaEventos"></div>
    <button onclick="mostrarFormulario()">+ Nuevo evento</button>
  </div>

  <!-- Vista: nuevo evento -->
  <div id="vistaFormulario" class="page hidden">
    <button class="btn-ghost" style="margin-bottom:16px" onclick="mostrarLista()">← Volver</button>
    <h2>Nuevo evento</h2>
    <div class="field"><input id="f-nombre" placeholder="Nombre del evento" /></div>
    <div class="field"><input id="f-lugar" placeholder="Lugar" /></div>
    <div class="field"><input id="f-descripcion" placeholder="Descripción (opcional)" /></div>
    <div class="field"><input id="f-fecha" type="date" /></div>
    <div class="field"><input id="f-hora" type="time" /></div>
    <div class="field"><input id="f-aforo" type="number" placeholder="Aforo" /></div>
    <div class="field"><input id="f-precioBase" type="number" placeholder="Precio por boleta" /></div>
    <div class="field"><input id="f-precioMinimo" type="number" placeholder="Precio mínimo por boleta" /></div>
    <div id="f-recaudo" class="card num" style="text-align:center; font-size:18px;"></div>
    <div id="f-error" class="status err hidden" style="margin-bottom:12px"></div>
    <button onclick="crearEvento()">Crear evento</button>
  </div>

  <!-- Vista: estadísticas de un evento -->
  <div id="vistaStats" class="page hidden">
    <button class="btn-ghost" style="margin-bottom:16px" onclick="mostrarLista()">← Volver</button>
    <h2 id="stats-nombre"></h2>
    <div class="ticket">
      <div class="row"><span>Boletas vendidas</span><span class="num" id="stats-vendidas"></span></div>
      <div class="row"><span>Total recaudado</span><span class="num" id="stats-recaudado"></span></div>
      <div class="row"><span>Ticket promedio</span><span class="num" id="stats-promedio"></span></div>
      <div class="row"><span>Ingresaron</span><span class="num" id="stats-ingresaron"></span></div>
    </div>
    <h3 style="margin:18px 0 10px">Ventas por vendedor</h3>
    <div id="stats-vendedores"></div>
  </div>

  <script>
    initMenu();
    const TOKEN = localStorage.getItem("token");
    const authHeaders = { Authorization: `Bearer ${TOKEN}` };

    function mostrarLista() {
      document.getElementById("vistaLista").classList.remove("hidden");
      document.getElementById("vistaFormulario").classList.add("hidden");
      document.getElementById("vistaStats").classList.add("hidden");
      cargarEventos();
    }

    function mostrarFormulario() {
      document.getElementById("vistaLista").classList.add("hidden");
      document.getElementById("vistaFormulario").classList.remove("hidden");
      document.getElementById("f-error").classList.add("hidden");
    }

    let todosLosEventos = [];

    function renderEventos(lista, mensajeVacio) {
      const cont = document.getElementById("listaEventos");
      cont.innerHTML = lista.map((ev) => {
        const pct = ev.aforo ? Math.round((ev.vendidas / ev.aforo) * 100) : 0;
        const colorEstado = { borrador: "#9ca3af", activo: "#4e9b6b", cerrado: "#c98a3a", cancelado: "#c1503f" }[ev.estado];
        const bgEstado = { borrador: "#262c35", activo: "#21332a", cerrado: "#362a1c", cancelado: "#33201d" }[ev.estado];
        return `
          <div class="ticket">
            <div class="row" style="border:none; padding-top:0; margin-top:0">
              <h3>${ev.nombre}</h3>
              <span class="badge" style="background:${bgEstado}; color:${colorEstado}">${ev.estado}</span>
            </div>
            <div class="meta">${ev.lugar ?? ""} · ${new Date(ev.fecha_inicio).toLocaleString()}</div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="meta">${ev.vendidas}/${ev.aforo} boletas · $${Number(ev.recaudado).toLocaleString()} recaudado</div>
            <div class="stub">
              <div style="margin-bottom:10px">
                ${["borrador", "activo", "cerrado", "cancelado"].map((e) =>
                  `<button class="btn-tab estado-btn ${e === ev.estado ? "activo-actual" : ""}" onclick="cambiarEstado(${ev.id}, '${e}')">${e}</button>`
                ).join("")}
              </div>
              <button class="btn-ghost" onclick="verEstadisticas(${ev.id})">Ver estadísticas</button>
            </div>
          </div>`;
      }).join("") || `<p>${mensajeVacio}</p>`;
    }

    async function cargarEventos() {
      const r = await fetch("/api/eventos", { headers: authHeaders });
      todosLosEventos = await r.json();
      document.getElementById("buscar-evento").value = "";
      renderEventos(todosLosEventos.slice(0, 3), "No hay eventos todavía.");
    }

    document.getElementById("buscar-evento").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderEventos(todosLosEventos.slice(0, 3), "No hay eventos todavía.");
        return;
      }
      const filtrados = todosLosEventos.filter((ev) => ev.nombre.toLowerCase().includes(q));
      renderEventos(filtrados, "No se encontró ningún evento con ese nombre.");
    });

    function actualizarRecaudo() {
      const aforo = Number(document.getElementById("f-aforo").value) || 0;
      const precio = Number(document.getElementById("f-precioBase").value) || 0;
      document.getElementById("f-recaudo").textContent = `Recaudo si se llena: $${(aforo * precio).toLocaleString()}`;
    }
    ["f-aforo", "f-precioBase"].forEach((id) =>
      document.getElementById(id).addEventListener("input", actualizarRecaudo)
    );

    async function crearEvento() {
      const errorDiv = document.getElementById("f-error");
      errorDiv.classList.add("hidden");

      const nombre = document.getElementById("f-nombre").value.trim();
      const lugar = document.getElementById("f-lugar").value.trim();
      const descripcion = document.getElementById("f-descripcion").value.trim();
      const fecha = document.getElementById("f-fecha").value;
      const hora = document.getElementById("f-hora").value || "00:00";
      const aforo = Number(document.getElementById("f-aforo").value);
      const precioBase = Number(document.getElementById("f-precioBase").value);
      const precioMinimo = Number(document.getElementById("f-precioMinimo").value);

      if (!nombre || !fecha || !aforo || !precioBase || !precioMinimo) {
        errorDiv.textContent = "Completa todos los campos obligatorios.";
        errorDiv.classList.remove("hidden");
        return;
      }
      if (precioMinimo > precioBase) {
        errorDiv.textContent = "El precio mínimo no puede ser mayor al precio base.";
        errorDiv.classList.remove("hidden");
        return;
      }

      const fechaInicio = new Date(`${fecha}T${hora}:00`).toISOString();

      const r = await fetch("/api/eventos", {
        method: "POST",
        headers: { ...authHeaders, "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, lugar, descripcion, fechaInicio, aforo, precioBase, precioMinimo }),
      });
      const data = await r.json();
      if (!r.ok) {
        errorDiv.textContent = typeof data.error === "string" ? data.error : "Datos inválidos, revisa los campos.";
        errorDiv.classList.remove("hidden");
        return;
      }
      mostrarLista();
    }

    async function cambiarEstado(id, estado) {
      if (!confirm(`¿Cambiar el evento a "${estado}"?`)) return;
      await fetch(`/api/eventos/${id}/estado`, {
        method: "PATCH",
        headers: { ...authHeaders, "Content-Type": "application/json" },
        body: JSON.stringify({ estado }),
      });
      cargarEventos();
    }

    async function verEstadisticas(id) {
      const evR = await fetch(`/api/eventos/${id}`, { headers: authHeaders });
      const ev = await evR.json();
      const r = await fetch(`/api/eventos/${id}/estadisticas`, { headers: authHeaders });
      const data = await r.json();

      document.getElementById("vistaLista").classList.add("hidden");
      document.getElementById("vistaStats").classList.remove("hidden");
      document.getElementById("stats-nombre").textContent = ev.nombre;
      document.getElementById("stats-vendidas").textContent = data.resumen.entradas_vendidas ?? 0;
      document.getElementById("stats-recaudado").textContent = `$${Number(data.resumen.total_recaudado ?? 0).toLocaleString()}`;
      document.getElementById("stats-promedio").textContent = `$${Number(data.resumen.ticket_promedio ?? 0).toLocaleString()}`;
      document.getElementById("stats-ingresaron").textContent = `${data.asistencia.ingresaron} / ${data.asistencia.vendidas}`;
      document.getElementById("stats-vendedores").innerHTML = data.porVendedor.map((v) =>
        `<div class="card row" style="border:none"><span>${v.nombre}</span><span class="num">${v.ventas} ventas · $${Number(v.recaudado).toLocaleString()}</span></div>`
      ).join("") || "<p>Sin ventas todavía.</p>";
    }

    mostrarLista();
  </script>
</body>
</html>
